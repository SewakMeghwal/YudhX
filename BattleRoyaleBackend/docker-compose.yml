version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: battleroyale_db
      POSTGRES_USER: br_admin
      POSTGRES_PASSWORD: br_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=prod-secret-key-yudhx-br-2026
    depends_on:
      - db

volumes:
  postgres_data:
